<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon" />
		<title>Portfolio - John Doe</title>
		<link rel="stylesheet" href="css/style.css" />
		<script type="module" src="js/main.js" defer></script>
	</head>
	<body>
		<header id="header">
			<div class="container">
				<a id="header-title" class="name title nav-link" href="/"></a>
				<ul id="nav-menu" class="list">
					<li><a class="nav-link" href="#hero">Home</a></li>
					<li><a class="nav-link" href="#about">About</a></li>
					<li><a class="nav-link" href="#projects">Projects</a></li>
					<li><a class="nav-link" href="#contact">Contact</a></li>
				</ul>
				<span id="open-hamburger-menu" aria-expanded="false" role="button">
					<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20">
						<path fill="currentColor" d="M0 3h30v2H0zm0 6h30v2H0zm0 6h30v2H0z" />
					</svg>
				</span>
			</div>
		</header>
		<div id="menu-container" aria-hidden="true">
			<div id="hamburger-menu">
				<div id="menu-header">
					<span id="close-hamburger-menu" role="button">
						<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
							<path
								fill="currentColor"
								d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
							></path>
						</svg>
					</span>
				</div>
				<ul id="menu-links" class="list">
					<li><a class="nav-link" href="#hero">Home</a></li>
					<li><a class="nav-link" href="#about">About</a></li>
					<li><a class="nav-link" href="#projects">Projects</a></li>
					<li><a class="nav-link" href="#contact">Contact</a></li>
				</ul>
			</div>
		</div>
		<section id="hero" class="section">
			<div id="profile-card">
				<img id="avatar" src="" alt="" />
				<h1 class="name secondary-title title"></h1>
				<p id="title" class="paragraph"></p>
				<ul id="social-media" class="list"></ul>
			</div>
		</section>
		<section id="about" class="section">
			<div id="about-grid">
				<img id="about-image" alt="" />
				<h3 class="primary-title title">About me</h3>
				<div id="bio"></div>
			</div>
		</section>
		<section id="projects" class="section">
			<div class="container">
				<h3 class="primary-title title">Projects</h3>
				<div id="projects-grid"></div>
			</div>
		</section>
		<section id="contact" class="section">
			<div class="container">
				<h3 class="primary-title title">Contact</h3>
				<form id="contact-form">
					<input type="text" id="name-input" class="input" placeholder="Full name" required="" />
					<input type="email" id="email-input" class="input" placeholder="E-mail" required="" />
					<input type="text" id="subject-input" class="input" placeholder="Subject" required="" />
					<textarea id="message-input" class="textarea" placeholder="Message" rows="6" required=""></textarea>
					<button type="submit" class="filled-button">Send</button>
				</form>
			</div>
		</section>
		<footer id="footer">
			<p class="paragraph">© 2025 Felipe Coletti</p>
		</footer>
	</body>
</html>
